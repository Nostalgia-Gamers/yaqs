[package]
name = "yaqs"
version = "0.1.2"
description = "Yet Another Query Server: live game server watcher"
edition = "2021"

[lib]
name = "yaqs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bzip2-rs = "0.1"
crc32fast = "1"
fastrand = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
semver = "1"
minisign-verify = "0.2"
base64 = "0.22"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-registry = "0.6"

# Debug builds (cargo test/check, tauri dev) keep line tables for our own code
# and no debug info for dependencies: with full debug info target/debug grew
# to 8 GB. Panics and backtraces still show file:line for YAQS code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
