name: Build

on:
  push:
    branches: [ master, main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# check and publish run on the organisation runners labelled ci, which spend no
# GitHub Actions minutes. When those runners are down, set the organisation
# variable CI_RUNNER to github and they run on GitHub-hosted runners instead.
#
# The Windows build cannot: the ci runners are Linux, and the app (WebView2,
# MSVC, NSIS) is built on Windows. It runs on windows-latest, which costs
# nothing because this repository is public.
#
# Artifacts use GitHub's storage rather than Harbor (ci-actions/artifact): it is
# free for public repositories and the Windows runner reaches it without the
# Cloudflare layer limit.
jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-24.04' || fromJSON('["self-hosted", "ci"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Tauri links against WebKitGTK on Linux even just to run the tests.
      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config

      - name: Install frontend dependencies
        run: npm ci

      # Type-checks the UI (including that es.ts has every key en.ts has) and
      # produces dist/, which the Rust build embeds.
      - name: Type-check and build the UI
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Release version tool
        run: |
          test "$(python3 tools/release_version.py refs/tags/v1.2.3)" = 1.2.3
          test "$(python3 tools/release_version.py refs/heads/master)" = 0.0.0-dev
          if python3 tools/release_version.py refs/tags/v1.2 2>/dev/null; then
            echo "release_version.py accepted a non-semver tag" >&2
            exit 1
          fi

  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # A tag v1.2.3 builds 1.2.3. Other refs keep the version in
      # tauri.conf.json: the installer needs a numeric version, not 0.0.0-dev.
      - name: Derive the build version
        id: version
        run: |
          v=$(python tools/release_version.py "$GITHUB_REF")
          if [ "$v" = 0.0.0-dev ]; then
            v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      # Update packages are signed with the key whose public half is in
      # tauri.conf.json; the app refuses anything else. Pull requests from
      # forks get no secrets, so they build without update packages.
      - name: Build the app and installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          config="{\"version\":\"${{ steps.version.outputs.value }}\"}"
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            config="{\"version\":\"${{ steps.version.outputs.value }}\",\"bundle\":{\"createUpdaterArtifacts\":false}}"
          fi
          npx tauri build --bundles nsis --config "$config"

      - name: Make and sign the portable exe
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          node scripts/portable.mjs "${{ steps.version.outputs.value }}"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri signer sign "src-tauri/target/release/bundle/portable/YAQS_${{ steps.version.outputs.value }}_x64-portable.exe"
          fi

      - name: Collect the outputs
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe* out/
          cp src-tauri/target/release/bundle/portable/*-portable.exe* out/
          ls -l out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaqs-windows-x64
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ check, build ]
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-24.04' || fromJSON('["self-hosted", "ci"]') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tagged commit must be on master
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: yaqs-windows-x64
          path: dist

      - name: The release must not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; delete the release and the tag, then make a new version" >&2
            exit 1
          fi

      # latest.json is what installed and portable copies poll to update.
      - name: Write the update manifest
        run: python3 tools/update_manifest.py "${{ needs.build.outputs.version }}" "$GITHUB_REPOSITORY" dist

      # Fixed names, so .../releases/latest/download/YAQS_x64-setup.exe always
      # serves the newest version (a permanent download link).
      - name: Add the always-latest copies
        run: |
          v="${{ needs.build.outputs.version }}"
          cp "dist/YAQS_${v}_x64-setup.exe" dist/YAQS_x64-setup.exe
          cp "dist/YAQS_${v}_x64-portable.exe" dist/YAQS_x64-portable.exe

      - name: Write the checksums
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.sig
            dist/latest.json
            dist/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          overwrite_files: false
